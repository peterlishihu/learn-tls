[workspace]
resolver = "2"
members = [
    "shared",
    "lesson01",
    "lesson02",
    "lesson03",
    "lesson04",
    "lesson05",
    "lesson06",
    "lesson07",
    "lesson08",
    "lesson09",
    "lesson10",
    "lesson11",
    "lesson12",
    "lesson13",
]

[workspace.dependencies]
# Core rustls dependencies
# 统一使用 rustls 0.23 系列（ring provider，无 aws-lc 依赖，编译更快）：
# - 课程代码按 0.23 API 编写
# - quinn (lesson13) 与 tokio-rustls 同样依赖 rustls 0.23，全仓库单版本
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1.0"

# QUIC (lesson13): quinn 的 TLS 引擎正是 rustls
quinn = "0.11"
bytes = "1"

# Utilities
rustls-pemfile = "2.0"
webpki-roots = "0.26"
x509-parser = "0.16"
rcgen = "0.13"
chrono = "0.4"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-rustls = "0.26"
mio = { version = "1.0", features = ["net", "os-poll"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Testing
hex = "0.4"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
